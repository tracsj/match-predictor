name: forward forecast

# Predict upcoming fixtures, commit the file before kickoff, grade what has
# settled. The commit timestamp is the evidence, which is the whole reason this
# runs here rather than on a laptop.
#
# CADENCE. football-data's fixtures.csv is a ROLLING ~4-DAY WINDOW, not a season
# fixture list, and it is collected Friday <=17:00 UK for the weekend and
# Tuesday <=13:00 UK for midweek. So the schedule has to satisfy two things at
# once: fire after each upload, and never leave a gap longer than the window.
# Tuesday + Friday tiles it exactly. A weekly run, or a Thursday/Saturday pair,
# leaves a five-day gap in which fixtures are silently never predicted.
#
# DST. Cron here is UTC only, while both upload deadlines are UK local, so a
# fixed UTC time drifts an hour across the BST boundary.
#
# LATENESS. GitHub starts scheduled runs when it has capacity, not on time.
# Measured 2026-08-28 -> 09-29: Tuesday runs started 4h-5h22m late and Friday
# runs 2h22m-7h43m late, and 87 of 134 never-predicted fixtures were lost to
# that alone (scripts/forward_coverage_attribution.py; docs/research/
# 00-measured-facts.md). So each day gets several slots, and whichever starts
# first predicts. Repeat runs are safe: a fixture already in any committed file
# is skipped, and each run writes its own file, so a later run can never change
# an earlier one's commit time. Minutes are off the hour because the top of the
# hour is when GitHub's scheduler is most congested.
#
#   Tue 13:07-16:07 UTC  all after the 13:00 UK upload in both regimes
#   Fri 16:07, 16:37 UTC after the 17:00 UK upload in BST only; in GMT they
#                        may find nothing new, which costs nothing
#   Fri 17:07, 17:37 UTC after the upload in both regimes
#
# The 17:30/18:00 UK Friday kickoffs are only reachable by an early BST slot
# that starts on time. The Tuesday feed does not reach Friday.

# Run history before 2026-08-27 lives in tracsj/match-predictor-archive, the
# private repo this one was published from. See predictions/README.md.

on:
  schedule:
    - cron: "7 13,14,15,16 * * 2"
    - cron: "7,37 16,17 * * 5"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race for the same commit.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. src/grade.py establishes each
      # prediction file's provenance with `git log -1 --format=%cI -- <path>`,
      # and checkout defaults to a depth-1 shallow clone. On that clone every
      # file committed in an earlier run has no history, so file_committed_at
      # returns None, every prediction reads as "uncommitted", and the ledger
      # grades nothing at all -- silently, and while reporting success.
      #
      # ref is REQUIRED too, because of the retry slots. Without it checkout
      # takes the commit that was current when the run was CREATED. A run that
      # was created late and then queued behind another would check out a tree
      # without the earlier run's prediction file, predict the same fixtures
      # again, and have its push rejected.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Pinned exactly, not to a major tag: astral-sh/setup-uv publishes major
      # tags only up to v7 while its current release is v10.0.1, so `@v10` does
      # not resolve. checkout and cache do maintain theirs.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      # data/ is gitignored, so a cold runner would fetch ~764 files. The cache
      # key is date-stamped with restore-keys as the fallback: a static key is
      # never re-saved, so the current-season files deleted by the refresh would
      # be re-fetched on every single run.
      - name: Cache date
        id: cachedate
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache raw football-data CSVs
        uses: actions/cache@v6
        with:
          path: data/raw/footballdata
          key: footballdata-raw-${{ steps.cachedate.outputs.today }}
          restore-keys: |
            footballdata-raw-

      # Re-fetches the current season and purges its keys from _missing.json,
      # which download_all cannot do. Fails loudly if the file count drops.
      - name: Refresh corpus
        run: uv run python -m src.refresh

      - name: Tests
        run: uv run pytest -q

      # A fresh runner has no SportMonks cache and no .env, so test_players,
      # test_tier2 and test_sportmonks_parse skip BY DESIGN -- the forward path
      # needs no credentials. Do not "fix" those skips.
      #
      # What must not skip is the four checks CLAUDE.md names as the reason any
      # number here is trustworthy. Without this step a runner with no corpus
      # skips all of them and reports green, which is worse than having no CI.
      - name: Assert the harness self-tests actually ran
        run: uv run python scripts/assert_selftests_ran.py

      - name: Predict upcoming fixtures
        run: uv run python -m src.forward --no-refresh

      - name: Grade what has settled
        run: uv run python -m src.grade

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions docs/FORWARD_LEDGER.md
          if git diff --cached --quiet; then
            echo "nothing new to commit (no fixtures in the window, or none settled)"
            exit 0
          fi
          git commit -m "Forward run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
